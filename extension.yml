schema_version: "1.0"

extension:
  id: "verify-review-ship"
  name: "Verify Review Ship"
  version: "0.3.0"
  description: "Adds verify and review quality gates plus transactional merge, cleanup, and delivery summary."
  category: "process"
  effect: "read-write"
  author: "Carlos Eduardo Gevaerd Araujo"
  repository: "https://github.com/cadugevaerd/spec-kit-verify-review-ship"
  license: "MIT"
  homepage: "https://github.com/cadugevaerd/spec-kit-verify-review-ship"

requires:
  speckit_version: ">=0.1.0"
  commands: ["speckit.implement", "speckit.analyze"]

provides:
  commands:
    - name: "speckit.verify-review-ship.verify"
      file: "commands/verify.md"
      description: "Verify implementation against Spec Kit artifacts and project gates."
      aliases: ["speckit.verify-review-ship.v"]
    - name: "speckit.verify-review-ship.review"
      file: "commands/review.md"
      description: "Run a five-axis code review for current changes."
      aliases: ["speckit.verify-review-ship.r"]
    - name: "speckit.verify-review-ship.ship"
      file: "commands/ship.md"
      description: "Decide readiness, merge a GO change, clean its worktree/branch, and summarize delivery."
      aliases: ["speckit.verify-review-ship.s"]
  config:
    - name: "verify-review-ship-config.yml"
      template: "config-template.yml"
      description: "Verification, review, merge, cleanup, and ship configuration."
      required: false

hooks:
  after_implement:
    command: "speckit.verify-review-ship.verify"
    priority: 10
    optional: true
    prompt: "Run verify gate after implementation?"
    description: "Checks implementation completeness and project verification gates after /speckit.implement."

tags: ["quality", "review", "shipping", "merge", "cleanup", "workflow", "agent-skills"]

defaults:
  orchestration:
    discover_subagents: true
    require_subagents: false
    max_parallel_agents: 4
  verify:
    after_implement: "optional"
    require_clean_worktree: false
    run_tests: true
    run_build: true
    run_lint: true
    run_typecheck: true
    require_spec_artifacts: true
  review:
    include_correctness: true
    include_readability: true
    include_architecture: true
    include_security: true
    include_performance: true
    validate_constitution: true
    severity_blocks_ship: ["Critical", "Important"]
  ship:
    require_verify_report: true
    require_review_report: true
    require_rollback_plan: true
    require_monitoring_notes: true
    default_decision_on_critical: "NO-GO"
    auto_merge_on_go: true
    remote: "origin"
    base_branch: ""
    merge_strategy: "no-ff"
    require_clean_worktree: true
    rerun_integration_gates: true
    push_base_branch: true
    remove_linked_worktree: true
    delete_local_work_branch: true
    delete_remote_work_branch: true
